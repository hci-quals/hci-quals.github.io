# Whether each reading is an idea reading or an instantiation reading.
# Idea readings introduce or argue a big idea: positions, visions, theories and frameworks, and the systems or
# prototypes that first embodied the idea. Instantiation readings take up an earlier idea: they test, apply, extend,
# review or retell it, or build a later system around it. The line is a judgment call; many readings do some of both.
