    position: The way computers represent information to us sets the boundaries of what tasks we can do.
    readings: [bertin-1967, iverson-1980, treisman-1980, tufte-1983, cleveland-1984, furnas-1986, mackinlay-1986, larkin-1987, pinker-1990, gallistel-1990,
