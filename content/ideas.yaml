    draft: true
    readings: [cypher-1991, nardi-1993, myers-2000, fails-2003, fogarty-2008, resnick-2009, gulwani-2011, ko-2011, victor-2012, amershi-2014, kulesza-2015,
      brown-2020, wei-2022, wu-2022, zamfirescu-pereira-2023, arawjo-2024, wobbrock-2007]

  - id: common-ground
