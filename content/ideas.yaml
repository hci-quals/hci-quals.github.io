      cockburn-2009, heer-2010, segel-2010, hullman-2011, healey-2012, victor-2012, munzner-2014, nielsen-2014, kay-2016,
      kim-2018, padilla-2018, hullman-2019, moritz-2019, franconeri-2021, lundgard-2022]

  - id: background
    name: Computing in the background
    position: Technology should inform without demanding attention, moving to the centre only when it matters.
    readings: [weiser-1991, weiser-1996, star-1999, horvitz-1999, rogers-2006, bell-2007, consolvo-2008, li-2010, harrison-2011, klasnja-2011, dourish-2011]

  - id: malleability
