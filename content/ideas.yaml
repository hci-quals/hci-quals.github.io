# The big ideas. Each has a short `name` and an opinionated `position`.
# `aka` is an alternative name still under discussion; `problem` is an open question the idea raises.
# `draft: true` marks a position Claude wrote or completed where the team's wording was missing or unfinished.
# `readings` lists reading ids (from content/articles/**). Readings unfold or illustrate the position, and some challenge it;
# a reading may sit under more than one idea.
# Readings under no idea are listed at the bottom of the site as "Not yet placed".

ideas:
  - id: augmentation
    name: Augmentation over automation
    position: Computers should improve human intelligence, not replace it.
    readings: [bush-1945, licklider-1960, engelbart-1962, engelbart-1968, bardini-2000, victor-2014,
      bainbridge-1983, endsley-1995, parasuraman-1997, parasuraman-2000, lee-2004,
      norman-1994, shneiderman-1997, horvitz-1998, horvitz-1999, shneiderman-2020, amershi-2019, yang-2020, heer-2019,
      yao-2023, sumers-2024, kapoor-2024, satyanarayan-2024, lee-2022, barke-2023,
      noy-2023, brynjolfsson-2025, dell-acqua-2026, simkute-2024, tankelevitch-2024, lee-2025, bastani-2025, doshi-2024, jakesch-2023, sharma-2024]

  - id: models
    name: Model of behaviour
    position: Behaviour must be modelled at multiple levels and understanding the mechanisms that produce behaviour are need to build useful interactions.
    problem: Do these models need to know internal mechanisms?
    readings: [fitts-1954, card-1978, card-1983, mackenzie-1992, accot-1997, zhai-2003, bi-2013, palin-2019, card-1991,
      marr-1982, anderson-1990, gallistel-1990, gershman-2015, lieder-2020, oulasvirta-2022,
      binz-2023, park-2023, argyle-2023, dillion-2023, hamalainen-2023, agnew-2024]

  - id: sensemaking
    name: Sensemaking
    position: Understanding comes from building structure around what you find, not from finding more.
    draft: true
    readings: [anderson-1990, pirolli-1999, fu-2007, pirolli-2005, kandel-2012, yi-2007, heer-2012, shneiderman-1996, victor-2011,
      kery-2017, rule-2018, ko-2004, brandt-2010]

  - id: intuitive-theories
    name: Intuitive theories
    position: People act on their intuitive theory of the system, not on the system itself.
    readings: [heider-1944, gentner-1983, kieras-1984, norman-1983, norman-1988, nass-1994, epley-2007, jara-ettinger-2016, lake-2017, ullman-2020, gambino-2020,
      eslami-2015, devito-2017, doshi-velez-2017, bansal-2019, kocielnik-2019, miller-2019, liao-2020, bansal-2021, bucinca-2021, vasconcelos-2023,
      kulesza-2015, zamfirescu-pereira-2023, mitchell-2023, shanahan-2023, ullman-2023, klokmose-2015]

  - id: offloading
    name: Cognitive offloading
    aka: Distributed cognition
    position: Computational tools should afford measurable cognitive offloading.
    readings: [bush-1945, kirsh-1994, zhang-1994, hutchins-1995, clark-1998, hollan-2000, wilson-2002, klemmer-2006, risko-2016,
      roediger-2006, matuschak-2019, appleton-2022, lee-2025]

  - id: situated
    name: Situated action
    aka: Scaffolding actions
    position: Plans are resources for action, not programs that drive it.
    draft: true
    readings: [simon-1969, simon-1973, rittel-1973, schon-1983, winograd-1986, suchman-1987, agre-1987, brooks-1991,
      dey-2001, dourish-2001, bellotti-2002, dourish-2004, dorst-2011, ho-2022, shankar-2024, alkhatib-2019,
      jansson-1991, landay-1995, tohidi-2006, hartmann-2006, buxton-2007-b, hartmann-2008, dow-2010]

  - id: direct-manipulation
    name: Direct manipulation
    position: The best interfaces let you act directly on what you see, so the action and its result are the same thing.
    readings: [sutherland-1963, sutherland-1968, gibson-1979, bolt-1980, shneiderman-1983, hutchins-1985, norman-1986, johnson-1989, buxton-1990, gaver-1991,
      milgram-1994, oviatt-1999, beaudouin-lafon-2000, buxton-2007, slater-2009, wobbrock-2009, hinckley-2010, norman-2010, wigdor-2011,
      beaudouin-lafon-2021, masson-2024, subramonyam-2024]

  - id: reification
    name: Reification
    aka: Concept design
    position: An abstraction becomes something people can think with once it is turned into an object they can see and manipulate.
    draft: true
    readings: [sutherland-1963, alexander-1977, hutchins-1985, ishii-1997, beaudouin-lafon-2000-b, stolte-2002, wilkinson-2005, bostock-2011, ishii-2012, follmer-2013, satyanarayan-2017,
      houde-1997, lim-2008]

  - id: representation
