sessions:
  augmentation:
    - theme: Founding visions and the ironies of automation
      main: [bush-1945, bainbridge-1983, parasuraman-1997]
      optional: [engelbart-1962, bardini-2000]
    - theme: Partners, agents and appropriate trust
      main: [licklider-1960, horvitz-1999, lee-2004]
      optional: [shneiderman-1997, norman-1994]
    - theme: Designing AI that extends people
      main: [victor-2014, heer-2019, satyanarayan-2024]
      optional: [amershi-2019, parasuraman-2000]
    - theme: What generative AI does to the people using it
      main: [endsley-1995, noy-2023, simkute-2024]
      optional: [bastani-2025, dell-acqua-2026]

  models:
    - theme: Movement is lawful
      main: [fitts-1954, mackenzie-1992, bi-2013]
      optional: [card-1978, accot-1997]
    - theme: Modelling the user
      main: [card-1983, gershman-2015, oulasvirta-2022]
      optional: [lieder-2020]
    - theme: What a model explains, and whether it can stand in for people
      main: [marr-1982, park-2023, agnew-2024]
      optional: [argyle-2023, binz-2023]

  sensemaking:
    - theme: Foraging for information
      main: [pirolli-1999, pirolli-2005, ko-2004]
      optional: [fu-2007, brandt-2010]
    - theme: Analysis as exploration
      main: [shneiderman-1996, kandel-2012, rule-2018]
      optional: [victor-2011, kery-2017]

  intuitive-theories:
    - theme: Mental models of devices and feeds
      main: [norman-1983, kieras-1984, eslami-2015]
      optional: [gentner-1983, devito-2017]
    - theme: Seeing minds in machines
      main: [heider-1944, nass-1994, epley-2007]
      optional: [shanahan-2023, ullman-2023]
    - theme: Calibrating reliance on AI
      main: [jara-ettinger-2016, bansal-2019, vasconcelos-2023]
      optional: [bucinca-2021, miller-2019]

  offloading:
    - theme: Thinking with the world
      main: [kirsh-1994, hutchins-1995, matuschak-2019]
      optional: [clark-1998, zhang-1994]
    - theme: What offloading costs and gives
      main: [hollan-2000, risko-2016, lee-2025]
      optional: [roediger-2006, appleton-2022]

  situated:
    - theme: Plans and situated actions
      main: [suchman-1987, agre-1987, alkhatib-2019]
      optional: [brooks-1991, dourish-2004]
    - theme: Design as a conversation with the situation
      main: [simon-1973, schon-1983, landay-1995]
      optional: [rittel-1973, dorst-2011]
    - theme: Exploring alternatives instead of committing
      main: [jansson-1991, hartmann-2008, dow-2010]
      optional: [tohidi-2006, shankar-2024]

  direct-manipulation:
    - theme: Where direct manipulation came from
      main: [sutherland-1963, shneiderman-1983, johnson-1989]
      optional: [sutherland-1968]
    - theme: Why it feels direct
      main: [hutchins-1985, gaver-1991, beaudouin-lafon-2000]
      optional: [norman-1986, buxton-1990]
    - theme: Beyond the mouse, and back again with AI
      main: [bolt-1980, hinckley-2010, masson-2024]
      optional: [norman-2010, subramonyam-2024]

  reification:
    - theme: Making abstractions graspable
      main: [alexander-1977, ishii-1997, follmer-2013]
      optional: [ishii-2012, lim-2008]
    - theme: Prototypes and grammars as objects to think with
      main: [houde-1997, wilkinson-2005, satyanarayan-2017]
      optional: [stolte-2002, bostock-2011]

  representation:
    - theme: The form of a representation shapes the task
      main: [bertin-1967, larkin-1987, norman-1993]
      optional: [zhang-1994, tufte-1983]
    - theme: Seeing graphics accurately
      main: [treisman-1980, cleveland-1984, heer-2010]
      optional: [mackinlay-1986, kim-2018]
    - theme: Representing uncertainty for decisions
      main: [gigerenzer-1995, kay-2016, padilla-2018]
      optional: [hullman-2019, hullman-2011]
    - theme: Notations as tools for thought
      main: [iverson-1980, green-1996, victor-2012]
      optional: [blackwell-2003]

  background:
    - theme: Calm and invisible
      main: [weiser-1991, star-1999, consolvo-2008]
      optional: [weiser-1996]
    - theme: Against calm
      main: [rogers-2006, bell-2007, klasnja-2011]
      optional: [dourish-2011, harrison-2011]

  malleability:
    - theme: Software everyone can reshape
      main: [kay-1977, papert-1980, wobbrock-2011]
      optional: [kay-1993]
    - theme: Systems that adapt to the people using them
      main: [woodruff-2007, gajos-2008, beaudouin-lafon-2021]
      optional: [myers-2000]

  end-user-programming:
    - theme: Languages that fit the task
      main: [cypher-1991, nardi-1993, resnick-2009]
      optional: [gulwani-2011, ko-2011]
    - theme: Teaching machines by example
      main: [fails-2003, wobbrock-2007, amershi-2014]
      optional: [fogarty-2008, kulesza-2015]
    - theme: Prompting as programming
      main: [myers-2000, brown-2020, zamfirescu-pereira-2023]
      optional: [wu-2022, arawjo-2024]

  common-ground:
    - theme: Grounding and awareness
      main: [clark-1991, dourish-1992, olson-2000]
      optional: [erickson-2000]
    - theme: Why group tools fail
      main: [grudin-1988, orlikowski-1992, ackerman-2000]
      optional: [kittur-2008]
    - theme: Audiences and communities
      main: [goffman-1959, marwick-2011, halfaker-2013]
      optional: [ostrom-1990, kraut-2012, matias-2019]

  beyond-being-there:
    - theme: Beyond imitating presence
      main: [engelbart-1968, hill-1992, hollan-1992]
      optional: [hancock-2020]
    - theme: Collaborating through crowds
      main: [von-2004, bigham-2010, gray-2019]
      optional: [bernstein-2010, irani-2013, starbird-2019]

  meta:
    - theme: What kind of field HCI is
      main: [grudin-1990, harrison-2007, hornbk-2017]
      optional: [card-1986, bdker-2006]
    - theme: Design and critique as ways of knowing
      main: [agre-1997, zimmerman-2007, gaver-2012]
      optional: [cross-1982, sengers-2005]
    - theme: Evaluating systems
      main: [gray-1998, olsen-2007, munzner-2009]
      optional: [greenberg-2008, nielsen-1990]
    - theme: Rigor, fieldwork and critical lenses
      main: [mcgrath-1995, dourish-2006, ogbonnaya-ogburu-2020]
      optional: [simmons-2011, bardzell-2010]
