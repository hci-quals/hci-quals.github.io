# Reading sessions within each big idea.
# Each session has about three `main` readings (read by everyone) and a few `optional` ones.
# Within a session, main readings should span at least two subfields and two decades, and the
# sessions of one idea should take roughly the same time to read. A main reading belongs to one
# session in the whole syllabus. Check with: python3 scripts/check_sessions.py
#
# `minutes` estimates reading time for the assigned portion (the chapters or sections named in the
# citation): about 15–30 for a short essay, 45 for a conference paper, 60–90 for a long journal
# article or several book chapters, and the running time for a talk or video.

