# DRAFT proposal: the same entries regrouped by deep idea instead of subfield.
# Each idea is stated as a claim someone could disagree with (`claim`), with a short name (`name`).
# Each entry appears once, under the idea it most clearly instantiates.
# `communities` gives a short name for each current part, used to show how widely an idea travels.

communities:
  part-1: Foundations
  part-2: Theory
  part-3: Input
  part-4: Ubicomp
  part-5: Design
  part-6: Social
  part-7: Programming
  part-8: Visualization
  part-9: Values
  part-10: Methods
  ai: AI

ideas:
  # What computers are for
  - id: augmentation
    name: Augmentation over automation
    claim: Computers should amplify human intellect, not replace it.
    articles:
      - computers-as-partners-that-augment-the-intellect
      - delegation-versus-control-agents-and-mixed-initiative
      - designing-for-uncertain-capable-systems
      - effects-on-peoples-work-thinking-and-beliefs

  - id: invisible-work
    name: Invisible work
    claim: Automation never removes work; it moves it to someone less visible.
    articles:
      - automation-shifts-work-instead-of-removing-it
      - crowds-as-computation-and-the-labor-behind-them
      - people-teach-machines

  # How people think and act
  - id: lawful-behaviour
    name: Models of behaviour
    claim: Much of what people do with computers is lawful enough to predict with simple models.
    articles:
      - the-user-as-an-information-processor
      - movement-can-be-modeled-and-predicted
      - text-entry-as-a-modeling-and-recognition-problem
      - levels-of-analysis-and-what-a-model-of-the-user-is
      - language-models-as-models-of-minds-and-people

  - id: foraging
    name: Information foraging and sensemaking
    claim: People look for information the way animals forage, following scent and stopping when it is good enough.
    articles:
      - behavior-as-adaptation-to-the-information-environment
      - visualization-as-interactive-analysis-and-sensemaking
      - tools-that-help-programmers-understand-code
      - exploration-versus-explanation

  - id: mental-models
    name: Mental models and folk theories
    claim: People act on their theory of the system, not on the system itself.
    articles:
      - mental-models-and-intuitive-theories
      - people-treat-computers-as-social-others
      - people-reason-about-invisible-algorithms
      - mental-models-explanation-and-appropriate-reliance

  - id: distributed-cognition
    name: Distributed cognition
    claim: Thinking happens in the person plus their tools and colleagues, so that whole system is what we design.
    articles:
      - cognition-extends-into-the-world
      - embodiment-ecology-and-affordances
      - bodies-matter-for-thinking
      - tools-for-thought

  - id: situated-action
    name: Situated action
    claim: Plans are resources for action, not programs that drive it.
    articles:
      - action-is-situated-not-planned
      - context-is-something-systems-sense-and-people-make
      - what-ethnography-is-for

  # Interfaces
  - id: gulfs
    name: The gulfs of execution and evaluation
    claim: An interface is only as good as the distance between what you mean and what happens.
    articles:
      - directness-and-instruments
      - natural-interaction-across-speech-touch-pen-and-gesture
      - natural-language-as-the-interface

  - id: reification
    name: Reification
    claim: Turn abstractions into objects people can see, point at and act on.
    articles:
      - interactive-graphics-and-the-personal-computer
      - input-devices-form-a-design-space
      - physical-objects-as-interfaces
      - immersive-and-mixed-reality

  - id: representation
    name: Representation
    claim: Change the representation and you change the problem.
    articles:
      - the-form-of-a-representation-shapes-the-task
      - notations-are-tools-for-thought
      - visual-variables-and-graphical-integrity
      - encodings-can-be-ranked-by-perceptual-accuracy
      - how-people-comprehend-graphs
      - communicating-uncertainty
      - navigating-information-larger-than-the-screen

  - id: calm
    name: Calm computing
    claim: The best technology recedes into the periphery of attention.
    articles:
      - computing-that-disappears-and-its-critics
      - sensing-people-in-daily-life

  # Making things
  - id: framing
    name: Planning in design
    claim: The hard part of design is deciding what the problem is.
    articles:
      - design-problems-are-ill-structured
      - explore-many-alternatives-before-committing
      - tools-that-support-design-itself
      - design-knowledge-can-be-formalized-and-automated

  - id: malleability
    name: Malleability and end-user programming
    claim: Everyone should be able to change the software they use.
    articles:
      - programming-for-everyone-else
      - low-threshold-high-ceiling
      - learning-by-building

  # People together
  - id: common-ground
    name: Common ground and social translucence
    claim: Groups coordinate through shared context and visible activity, and copying face-to-face does not supply either.
    articles:
      - collaboration-at-a-distance-needs-common-ground
      - make-social-activity-visible
      - designing-communities-with-social-science
      - self-presentation-and-governance-online

  - id: values
    name: Values in artifacts
    claim: Every artifact takes a side, including the ones that look neutral.
    articles:
      - artifacts-embody-values
      - visualizations-tell-stories-and-make-arguments
      - who-visualization-serves
      - whose-values-whose-voices
      - design-and-power-gender-race-and-colonial-histories
      - building-with-critical-reflection

  - id: participation
    name: Participation
    claim: The people a system affects should help make it.
    articles:
      - involving-people-in-design
      - accessibility-from-fixing-users-to-changing-systems
      - designing-for-and-with-the-global-south

  # How HCI knows
  - id: building-is-knowing
    name: Systems as contributions
    claim: Building a system is a way of knowing, and it should be judged on its own terms.
    articles:
      - making-things-as-a-form-of-research
      - evaluate-systems-on-their-own-terms
      - inspection-based-evaluation
      - designing-and-validating-visualization-systems

  - id: pluralism
    name: Ways of knowing
    claim: No single method or theory sees everything, so HCI needs many and must say what each one misses.
    articles:
      - how-hci-became-a-discipline
      - hci-has-shifted-paradigms
      - comparing-and-synthesizing-theories
      - ways-of-knowing
      - every-method-trades-something-off
      - statistics-replication-and-open-science
      - evaluating-models-with-and-through-people
      - can-models-stand-in-for-people
