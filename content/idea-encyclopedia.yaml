      - delegation-versus-control-agents-and-mixed-initiative
      - designing-for-uncertain-capable-systems
      - effects-on-peoples-work-thinking-and-beliefs

  - id: common-ground
    title: Common ground and awareness
    gloss: Groups coordinate by making activity visible and building shared understanding, online or off.
    articles:
      - collaboration-at-a-distance-needs-common-ground
      - make-social-activity-visible
      - designing-communities-with-social-science

  - id: invisible-work
    title: Invisible work
    gloss: Automation and platforms rarely remove work; they move it to people whose labour goes unseen.
