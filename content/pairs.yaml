    question: How does AI change the cost of building common ground between people?
  - older: [jansson-1991, dow-2010]
    newer: [doshi-2024]
    question: Does AI-generated inspiration cause fixation and homogenize ideas?
  - older: [gigerenzer-1995]
    newer: [kay-2016]
    question: Why do frequency formats make uncertainty easier to reason about?
  - older: [lake-2017]
    newer: [ullman-2023, binz-2023]
